<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>銘峰輪業｜內部庫存</title>

<style>
:root{
  --bg:#05070a;
  --card:#10151e;
  --card-soft:#151c27;
  --text:#e9f0f6;
  --muted:#9bb0c0;
  --accent:#ffd233;
  --border:#263142;
}

/* ===== 基本 ===== */
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top,#162030 0,#05070a 55%);
  color:var(--text);
  font-family:"Noto Sans TC",system-ui,-apple-system;
  font-size:18px;               /* ✅ 全站字體放大（桌機） */
  line-height:1.5;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(5,7,10,.9);
  border-bottom:1px solid rgba(255,255,255,.06);
  backdrop-filter: blur(10px);
}
.wrap{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
}
h1{
  margin:0;
  font-size:22px;               /* ✅ 標題更大 */
  font-weight:900;
  letter-spacing:2px;
}

/* ===== 卡片 ===== */
.card{
  background:rgba(10,14,20,.98);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  box-shadow:0 15px 40px rgba(0,0,0,.7);
  margin:18px auto;
  padding:16px;
}

/* ===== 表格（桌機） ===== */
.table-wrap{ overflow:auto; }

table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

th,td{
  padding:14px 10px;            /* ✅ 行高略放大但不鬆散 */
  border-top:1px solid rgba(255,255,255,.07);
  text-align:center;
  vertical-align:middle;
  font-size:18px;               /* ✅ 桌機表格字體放大 */
}

th{
  font-size:16px;               /* 表頭稍小但清楚 */
  color:var(--muted);
  font-weight:600;
}

.price{
  color:var(--accent);
  font-weight:900;
  font-size:20px;
}

.sub{
  display:block;
  margin-top:4px;
  font-size:14px;
  color:var(--muted);
}

/* 欄寬（桌機） */
.col-brand{width:90px}
.col-pattern{width:150px}
.col-size{width:130px}
.col-spec{width:90px}
.col-year{width:80px}
.col-qty{width:80px}
.col-price{width:120px}
.col-note{width:220px}
.col-updated{width:200px}

/* ===== 手機：穩定版卡片（字大但不胖） ===== */
@media (max-width:768px){

  body{
    font-size:19px;             /* ✅ 手機整體再大一點 */
  }

  table,thead,tbody,tr,th,td{
    display:block;
  }
  thead{display:none}

  tbody tr{
    background:var(--card-soft);
    border-radius:16px;
    margin:10px auto;           /* ✅ 卡片間距變小 */
    padding:12px 14px;          /* ✅ 卡片內距縮小 */
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 8px 22px rgba(0,0,0,.55);
    max-width:520px;            /* ✅ 卡片不佔滿整個螢幕 */
  }

  td{
    border:none;
    padding:6px 0;              /* ✅ 行距收緊 */
    text-align:left;
    font-size:19px;             /* ✅ 卡片內容字體放大 */
    line-height:1.45;
  }

  td::before{
    content:attr(data-label);
    display:block;
    margin-bottom:2px;
    font-size:15px;             /* ✅ 標籤字體放大 */
    color:var(--muted);
    letter-spacing:.5px;
  }

  /* 牌價：獨立強調，但不拉高整張卡 */
  td[data-label="牌價"]{
    text-align:center;
    padding:10px 0;
    font-size:24px;
    font-weight:900;
  }
  td[data-label="牌價"]::before{
    text-align:center;
    margin-bottom:4px;
  }

  /* 更新時間 */
  td[data-label="更新時間"] .sub{
    font-size:15px;
    margin-top:2px;
  }
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <h1>銘峰輪業｜內部庫存</h1>
  </div>
</header>

<main class="wrap">

<section class="card table-wrap">
<table>
<thead>
<tr>
  <th class="col-brand">品牌</th>
  <th class="col-pattern">型號</th>
  <th class="col-size">尺寸</th>
  <th class="col-spec">規格</th>
  <th class="col-year">年份</th>
  <th class="col-qty">數量</th>
  <th class="col-price">牌價</th>
  <th class="col-note">備註</th>
  <th class="col-updated">更新時間</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</section>

</main>

<script>
/* ===== Google Sheet 設定 ===== */
const SHEET_ID = "1sML4xO1ukPsoXyeU7ygRakjupdp4ZthQL7mXTCdNpUM";
const GID = "0";
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;

const rowsEl = document.getElementById("rows");

function money(v){
  const n = Number(v);
  if (Number.isNaN(n)) return v || "";
  return "＄" + n.toLocaleString("zh-Hant");
}

function timeAgo(s){
  if(!s) return "";
  const d = new Date(s.replace(" ","T"));
  const m = Math.floor((Date.now()-d)/60000);
  if(m<1) return "剛剛";
  if(m<60) return `${m} 分鐘前`;
  const h = Math.floor(m/60);
  if(h<24) return `${h} 小時前`;
  return `${Math.floor(h/24)} 天前`;
}

fetch(URL)
.then(r=>r.text())
.then(t=>{
  const json = JSON.parse(t.substring(t.indexOf("{"), t.lastIndexOf("}")+1));
  const cols = json.table.cols.map(c=>c.label);
  json.table.rows.forEach(r=>{
    const o={};
    r.c.forEach((c,i)=>o[cols[i]]=c?c.v:"");
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td data-label="品牌">${o.brand||""}</td>
      <td data-label="型號">${o.pattern||""}</td>
      <td data-label="尺寸">${o.size||""}</td>
      <td data-label="規格">${o.spec||""}</td>
      <td data-label="年份">${o.year||""}</td>
      <td data-label="數量">${o.qty||""}</td>
      <td data-label="牌價" class="price">${money(o.Price)}</td>
      <td data-label="備註">${o.note||""}</td>
      <td data-label="更新時間">
        ${timeAgo(o.updatedAt)}
        <span class="sub">${o.updatedAt||""}</span>
      </td>
    `;
    rowsEl.appendChild(tr);
  });
});
</script>

</body>
</html>
